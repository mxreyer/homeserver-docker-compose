services:

  tailscale-ollama:
    image: tailscale/tailscale:latest
    environment:
      - TS_HOSTNAME=${CONF_HOSTNAME_OLLAMA}
      - TS_AUTH_KEY=${CONF_TS_KEY_OLLAMA}
      - TS_EXTRA_ARGS=--advertise-tags=tag:${CONF_TS_TAG_OLLAMA}
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - ../../docker-binds/local-ai/tailscale_ollama/state:/var/lib/tailscale
      - tailscale_sock:/tmp # for caddy access to tailscale.sock
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    networks:
      - net
    healthcheck:
      test: tailscale status --peers=false --json | grep 'Online.*true'
      start_period: 3s
      interval: 1s
      retries: 3
    restart: unless-stopped

  caddy:
    image: caddy:latest
    environment:
      CDY_DOMAIN: ${CONF_DOMAIN_OLLAMA}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_certs:/certs
      - caddy_data:/data
      - caddy_config:/config
      - tailscale_sock:/var/run/tailscale/:ro # for access to tailscale.sock
    network_mode: service:tailscale-ollama
    depends_on:
      tailscale-ollama:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    devices:
      - /dev/dri:/dev/dri
    environment:
      - OLLAMA_VULKAN=1
      - OLLAMA_IGPU_ENABLE=1
      - OLLAMA_KEEP_ALIVE=10m
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_GPU_OVERHEAD=0
      - OLLAMA_CONTEXT_LENGTH=65536
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_MAX_QUEUE=4
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - net
    restart: unless-stopped

