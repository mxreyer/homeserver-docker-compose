  tailscale-openwebui:
    image: tailscale/tailscale:latest
    environment:
      - TS_HOSTNAME=${CONF_HOSTNAME_OPENWEBUI}
      - TS_AUTH_KEY=${CONF_TS_KEY_OPENWEBUI}
      - TS_EXTRA_ARGS=--advertise-tags=tag:${CONF_TS_TAG_OPENWEBUI}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ../../docker-binds/local-ai/tailscale_openwebui/state:/var/lib/tailscale
      - ./tailscale_openwebui/config:/config # for the serve.json config file
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    networks:
      - net
    healthcheck:
      test: tailscale status --peers=false --json | grep 'Online.*true'
      start_period: 3s
      interval: 1s
      retries: 3
    restart: unless-stopped
  
  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - open_webui_data:/app/backend/data
    network_mode: service:tailscale-openwebui
    depends_on:
      tailscale-openwebui:
        condition: service_healthy
      ollama:
        condition: service_started
      #sd-shim:
      #  condition: service_healthy
    restart: unless-stopped

