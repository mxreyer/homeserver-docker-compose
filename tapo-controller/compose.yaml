services:

  tailscale:
    image: tailscale/tailscale:latest
    environment:
      - TS_HOSTNAME=${CONF_HOSTNAME}
      - TS_AUTH_KEY=${CONF_TS_KEY}
      - TS_EXTRA_ARGS=--advertise-tags=tag:${CONF_TS_TAG}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ../../docker-binds/tapo-controller/tailscale/state:/var/lib/tailscale
      - ./tailscale/config:/config # for the serve.json config file
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    networks:
      - net
    healthcheck:
      test: tailscale status --peers=false --json | grep 'Online.*true'
      start_period: 3s
      interval: 1s
      retries: 3
    restart: unless-stopped

  tapo-controller:
    # Source: https://github.com/mxreyer/tapo-controller
    image: ghcr.io/mxreyer/tapo-controller:latest
    volumes:
      # Which plugs back a server, and how to shut each one down.
      - ./servers.json:/config/servers.json:ro
      # SSH key used to run the shutdown command. Keep the private key 0600 on
      # the host; ssh refuses to use a world-readable key.
      - ./ssh:/ssh
    environment:
      TAPO_USERNAME: ${CONF_TAPO_USERNAME}
      TAPO_PASSWORD: ${CONF_TAPO_PASSWORD}
      TAPO_HOSTS: ${CONF_TAPO_HOSTS}
      # Broadcast discovery cannot work from inside the tailscale sidecar's
      # network namespace, so plugs must be listed in TAPO_HOSTS explicitly.
      TAPO_DISCOVERY: "false"
      TAPO_SERVERS_FILE: /config/servers.json
      SSH_KNOWN_HOSTS: /ssh/known_hosts
      WEB_USERNAME: ${CONF_WEB_USERNAME}
      WEB_PASSWORD: ${CONF_WEB_PASSWORD}
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
    restart: unless-stopped

networks:
  net:
